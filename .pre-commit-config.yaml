repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: local
    hooks:
      - id: schema-drift
        name: JSON Schema drift check
        entry: python scripts/export_schemas.py --check
        language: system
        pass_filenames: false
