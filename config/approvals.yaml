    code_scope: >-
      ADR 0003 migration step 2: IdempotencyStore (hash-chained, fsynced, torn-tail safe; in-memory option)
      records every order_id as RESERVED before the simulator processes it and closes it after; a reused
      order_id or client_order_id raises DuplicateOrder; a record that cannot be written means the order is
      not sent. client_order_id = "ta1-" + first 40 hex of sha256(order_id, environment, account).
      SimulatedBroker takes the store, keeps its own order book by client_order_id (lookup_order,
      order_book, restore_orders) and gains restore_positions; ExecutionPort gains read-only lookup_order.
      resolve_unresolved settles reserved-but-unclosed orders by broker lookup (found => RESOLVED; absent
      and past expires_at + skew => ABANDONED, never resent; otherwise unresolved). Outside /execution the
      live loop (orchestration/live_loop.py) opens a durable store in the run directory, persists the
      broker's orders in broker_book.json, settles at restart and HALTs on UNRESOLVED_ORDER, a failed
      lookup, or orders without a ledger; tick.py audits client_order_id. Tests:
      tests/invariants/test_idempotency.py, tests/live/test_live_idempotency.py. Supersedes APR-0005 for
      simulated_broker.py; APR-0005's other files are unchanged and re-listed here. Approved before commit;
      the approving commit is the one that adds this entry.
    not_approved_for: [REPLAY, PAPER, SHADOW, CANARY_LIVE, LIMITED_LIVE, FULL_CONFIGURED_LIVE]
